name: Build 90s Anime Reddit Short

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-reddit-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install narration tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts

      - name: Generate missing scene artwork (free-tier Cloudflare Workers AI)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/generate_anime_images.py

      - name: Render anime story
        run: |
          python scripts/build_anime_reddit_short.py
          test -s output/anime/anime_reddit_story.mp4
          test -s output/anime/preview.mp4

      - name: Upload finished Short and preview
        uses: actions/upload-artifact@v4
        with:
          name: anime-reddit-short
          path: |
            output/anime/anime_reddit_story.mp4
            output/anime/preview.mp4
            output/anime/metadata.json
            output/anime/captions.srt
          if-no-files-found: error
          retention-days: 7
