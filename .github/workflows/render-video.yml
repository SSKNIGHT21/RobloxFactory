name: Build AI-generated Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - "clips/**"
      - "audio/**"
      - "story.json"
      - "scripts/build_ai_short.py"

permissions:
  contents: read

concurrency:
  group: robloxfactory-ai-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Assemble AI-generated clips
        run: |
          mkdir -p output
          python3 scripts/build_ai_short.py
          test -s output/roblox_story.mp4
          test -s output/preview.mp4

      - name: Validate final Short
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json output/roblox_story.mp4 > output/metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open("output/metadata.json", encoding="utf-8"))
          duration = float(data["format"]["duration"])
          video = next(s for s in data["streams"] if s["codec_type"] == "video")
          assert 5.5 <= duration < 60, f"Expected a Short under 60 seconds, got {duration:.2f}s"
          assert video["width"] == 720 and video["height"] == 1280, f"Unexpected video dimensions: {video}"
          print(f"VALID: {duration:.2f}s, {video['width']}x{video['height']}, {video['r_frame_rate']}")
          PY

      - name: Upload finished Short and preview
        uses: actions/upload-artifact@v4
        with:
          name: robloxfactory-ai-short
          path: |
            output/roblox_story.mp4
            output/preview.mp4
            output/metadata.json
            output/captions.srt
          if-no-files-found: error
          retention-days: 7
